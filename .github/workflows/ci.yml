name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  ragas-quality-gate:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Reads committed ragas_results.json — no live LLM call needed.
      # faithfulness_alert.py exits 1 when score < 0.80, failing this job.
      # The 0.75 hard gate also runs as a safety net.
      - name: Faithfulness alert (>= 0.80)
        run: uv run python scripts/faithfulness_alert.py --threshold 0.80

      - name: Faithfulness quality gate (>= 0.75)
        run: |
          python -c "
          import json, sys
          d = json.load(open('data/evaluation/ragas_results.json'))
          f = d['metrics']['faithfulness']
          print(f'Faithfulness: {f}')
          sys.exit(0 if f >= 0.75 else 1)
          "

  docker:
    runs-on: ubuntu-latest
    needs: [test, ragas-quality-gate]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.GHCR_OWNER }}/arabic-legal-rag:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
