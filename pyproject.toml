[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-legal-rag"
version = "0.1.0"
description = "Arabic Legal Document Q&A RAG Pipeline over the Egyptian Civil Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aya" }
]

dependencies = [
    "pymupdf>=1.23.0",
    "pydantic>=2.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "dvc>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
