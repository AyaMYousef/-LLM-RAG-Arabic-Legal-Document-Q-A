[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-legal-rag"
version = "0.1.0"
description = "Arabic Legal Document Q&A RAG Pipeline over the Egyptian Civil Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aya" }
]

dependencies = [
    "pymupdf>=1.23.0",
    "pydantic>=2.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "dvc>=3.0.0",
    "sentence-transformers>=6.1.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "ragas==0.4.3",
    "langchain-community<0.4",
    "openai>=3.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "mlflow>=3.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
